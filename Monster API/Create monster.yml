info:
  name: Create monster
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/monsters
  body:
    type: json
    data: |-
      {
        "name": "Dragon",
        "type": "Fire",
        "power": 150,
        "health": 500
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
